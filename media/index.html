<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <link rel="stylesheet" href="{{media}}/style.css"><title>BizTalk Rules Engine Viewer</title>
</head><body>
  <header><div><span class="eyebrow">BIZTALK RULE ENGINE</span><h1 id="title">Loading…</h1></div><div class="stats" id="stats"></div></header>
  <nav><select id="policy" aria-label="Policy"></select><input id="search" type="search" placeholder="Filter rules, conditions, and actions…"><label><input id="inactive" type="checkbox" checked> Show inactive</label></nav>
  <main><section id="error" class="error" hidden></section><section id="summary" class="summary"></section><section id="rules" class="rules"></section></main>
  <script nonce="{{nonce}}" src="{{media}}/main.js"></script>
</body></html>
